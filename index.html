function convTab(R){var d=ISADMIN?'':' disabled',G={};Object.keys(CONV).forEach(function(c){var f=famOf(c,CONV[c].d);(G[f]=G[f]||[]).push(c)});Object.keys(R.miss).forEach(function(c){var f=R.miss[c].f;G[f]=G[f]||[]});Object.keys(R.off||{}).forEach(function(c){var f=R.off[c];G[f]=G[f]||[]});
 var h='<div class="card"><h3>Tabla de conversión (galones por unidad)</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="nc" class="f" style="width:130px;text-align:left" placeholder="Código"'+d+'><input id="nd" class="f" style="width:240px;text-align:left" placeholder="Descripción"'+d+'><input id="nm" class="f" type="number" step="0.001" placeholder="Multiplicador"'+d+'><span class="btn" style="background:var(--navy)" onclick="addC()">➕ Agregar código</span></div><div style="color:var(--mut);font-size:11px;margin-top:6px">'+Object.keys(CONV).length+' códigos. Importa la tabla completa con "Multiplicador.xlsx" (barra superior). Apaga una familia para excluirla del galonaje.</div></div><div class="card"><h3>Familias de producto</h3>';
 Object.keys(G).sort().forEach(function(f){var L=G[f].sort(function(a,b){return ((R.cod[b]||{}).g||0)-((R.cod[a]||{}).g||0)}),g=L.reduce(function(a,c){return a+((R.cod[c]||{}).g||0)},0),on=FAM[f]!==false,op=OPEN[f];
  h+='<div style="border-top:1px solid var(--line);padding:9px 0"><div class="fam" data-f="'+esc(f)+'" onclick="togF(this)"><span>'+(op?'▾':'▸')+' '+esc(f)+'</span><span class="n">'+L.length+' códigos · '+fm(g)+' gal</span><span class="sp"></span><label class="sw" onclick="event.stopPropagation()"><input type="checkbox" data-f="'+esc(f)+'" '+(on?'checked':'')+d+' onchange="setF(this)"><i></i></label></div>';
  if(op)h+='<div class="sc"><table><tr><th class="l">Código</th><th class="l">Descripción</th><th>Multiplicador</th><th>Unidades</th><th>Galones</th><th></th></tr>'+L.map(function(c){var o=R.cod[c]||{q:0,g:0};return '<tr><td class="l">'+esc(c)+'</td><td class="l"><input class="f" style="width:300px;text-align:left" data-c="'+esc(c)+'" value="'+esc(CONV[c].d)+'"'+d+' onchange="setD(this)"></td><td><input class="f" type="number" step="0.001" data-c="'+esc(c)+'" value="'+CONV[c].m+'"'+d+' onchange="setM(this)"></td><td>'+fm(o.q)+'</td><td>'+fm(o.g)+'</td><td>'+(ISADMIN?'<span data-c="'+esc(c)+'" onclick="delC(this.dataset.c)" style="cursor:pointer;color:#c0392b;font-weight:800" title="Quitar código">✕</span>':'')+'</td></tr>'}).join('')+'</table></div>';h+='</div>'});
 return h+'</div>'}
function showMiss(){var R=window.RC,ks=Object.keys(R.miss),h='<h3 style="color:var(--navy);margin-bottom:6px">⚠️ Códigos sin multiplicador</h3><div style="color:var(--mut);margin-bottom:10px">Valida el multiplicador (galones por unidad) y agrégalo. Mientras tanto no suman galones.</div><table><tr><th class="l">Código</th><th class="l">Descripción</th><th>Filas</th><th>Multiplicador</th><th></th></tr>';
 ks.forEach(function(c,i){h+='<tr><td class="l">'+esc(c)+'</td><td class="l">'+esc(DESC[c]||'')+'</td><td>'+R.miss[c].n+'</td><td><input class="f" id="mm'+i+'" type="number" step="0.001" placeholder="gal"'+(ISADMIN?'':' disabled')+'></td><td>'+(ISADMIN?'<span class="btn" style="background:var(--navy)" onclick="addM(\''+c.replace(/'/g,"\\'")+'\','+i+')">Agregar</span>':'')+'</td></tr>'});
 document.getElementById('mb').innerHTML=h+'</table>';document.getElementById('modal').style.display='flex'}
function addM(c,i){var m=num(document.getElementById('mm'+i).value);if(!m){alert('Escribe un multiplicador mayor a 0');return}CONV[c]={d:DESC[c]||'',m:m};save();render();if(Object.keys(window.RC.miss).length)showMiss();else document.getElementById('modal').style.display='none'}
window.addEventListener('message',function(e){var d=e.data;if(!d||!d.type)return;
 if(d.type==='restoreState'&&d.state){var s=d.state;
  if(s.conc&&!CLOUD_OK){CONV=s.conc.conv||CONV;FAM=s.conc.fam||FAM;PAR=Object.assign(defPar(),s.conc.par||{})}render()}
 /* el rol de admin solo se activa con el código (botón Admin) */
 if(!CLOUD_OK){if(d.type==='valvolineData'&&d.text)loadCSV(d.text,d.name);if(d.type==='maestroData'&&d.text)loadMaestro(csvParse(d.text))}});
try{initTip()}catch(e){}lsLoad();render();cloudLoad().catch(function(e){CLOUD_OK=false;stat('⚠ Sin conexión con la base ('+e.message+'). Se muestran datos locales.')});try{parent.postMessage({type:'iframeReady',from:'concurso'},'*')}catch(e){}
</script></body></html>
